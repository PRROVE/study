<!-- HTML이란 웹 문서를 만들기 위한 MARKUP 언어
"마크업이란" 텍스트를 정보를 덧붙여 의미를 부여하는 것
HTML은 구조를 담당하고, 디자인은 css, js는 동작을 담당한다 -->

<!DOCTYPE html> <!--문서가 HTML5로 작성되었다는 선언-->
<html lang = "ko"> <!--문서의 loot 요소, lang="ko"는 한국어 문서임을 명시-->
<head>             <!--눈에 보이지 않는 정보, 외부파일 연결 ,제목 등 포함-->
    <meta charset="UTF-8"> <!--문자 인코딩 설정-->
    <title>나의 첫 웹페이지</title>    <!--제목-->
</head>
<body> <!--실제 화면에 보여지는 콘텐츠를 포함-->
    <h2>안녕하세요</h1>
    <p>이것은 나의 첫 HTML 문서입니다.</p>
</body>
</html>

<!-- 실무에서 자주 쓰이는 태그 -->

<!--텍스트 관련
<h1> ~ <h6>: 제목 (검색엔진 SEO에도 중요)
<p>: 문단
<br>: 줄바꿈 (문단 아님)
<strong>, <em>: 강조 (볼드, 이탤릭 역할도 있음)

링크와 이미지
<a href="URL" target="_blank">: 링크 (_blank는 새창 열기)
<img src="경로" alt="대체 텍스트">: 이미지 (alt는 이미지 로딩 실패 시 설명 제공)

목록
<ul>: 순서 없는 리스트 (●)
<ol>: 순서 있는 리스트 (1., 2., 3.)
<li>: 리스트 항목

레이아웃
<div>: 블록 단위 구역. CSS와 자바스크립트 제어에 자주 사용
<span>: 인라인 구역. 문장 중 특정 부분 스타일 적용 시 유용
-->
